<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login - Embed</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Poppins:wght@600&display=swap" rel="stylesheet"/>
</head>
<body>
  <main>
    <section class="container section login-popup" id="login-popup" style="position:relative;">
      <!-- close button -->
      <span id="login-close" class="close">&times;</span>

      <h2>Login</h2>
      <form action="#" method="post" class="login-form">
        <label>
          Email
          <input type="email" name="email" required>
        </label>
        <label>
          Password
          <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn">Sign in</button>
      </form>
    </section>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    var closeBtn = document.getElementById('login-close');
    if (!closeBtn) return;

    closeBtn.style.cursor = 'pointer';
    closeBtn.addEventListener('click', function (e) {
      e.preventDefault();
      try {
      window.parent.postMessage({ type: 'tmd-login-close' }, '*');
    } catch (err) {
      console.error("postMessage failed", err);
    }
    });
  });
  </script>
</body>
</html>
